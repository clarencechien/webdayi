<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebDayi Smart - 智慧 2 碼大易輸入法</title>
    <meta name="app-name" content="WebDayi Smart">
    <meta name="app-version" content="0.1.0">
    <meta name="app-build" content="20260812-001">
    <link rel="icon" type="image/svg+xml" href="../lite/icon.svg">
    <!-- WebDayi Smart 0.1.0 (PoC) — 智慧 2 碼:連碼輸入、Viterbi 解碼、可修正、全碼逃生口 -->
    <style>
        :root {
            --primary: #0fb8f0;
            --primary-hover: #0da2d4;
            --bg-main: #f5f8f8;
            --bg-surface: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger: #ef4444;
            --success: #22c55e;
            --warn: #f59e0b;
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 16px;
        }
        [data-theme="dark"] {
            --bg-main: #0f172a;
            --bg-surface: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            transition: background .2s;
        }
        .app { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 12px; }
        header { display: flex; align-items: baseline; justify-content: space-between; padding: 4px 2px; }
        header h1 { font-size: 1.15rem; }
        header .links { font-size: .8rem; color: var(--text-muted); }
        header .links a { color: var(--primary); text-decoration: none; }
        .card { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 12px; }

        /* 輸出區 */
        .out-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .out-head .label { font-size: .8rem; color: var(--text-muted); }
        .out-head button {
            border: 0; background: none; color: var(--primary); font-size: .9rem; cursor: pointer; padding: 4px 10px;
            border-radius: var(--radius-sm);
        }
        .out-head button:hover { background: color-mix(in srgb, var(--primary) 12%, transparent); }
        .out-head button.danger { color: var(--danger); }
        #output-buffer {
            width: 100%; min-height: 72px; resize: vertical; border: 1px solid var(--border-color);
            border-radius: var(--radius-md); background: var(--bg-main); color: var(--text-main);
            font-size: 1.15rem; padding: 10px; line-height: 1.6;
        }

        /* 緩衝區(暫定字) */
        .compose-area { min-height: 74px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 2px; }
        .compose-hint { color: var(--text-muted); font-size: .85rem; }
        .cell {
            display: flex; flex-direction: column; align-items: center; min-width: 44px; padding: 4px 6px;
            border-radius: var(--radius-sm); cursor: pointer; border: 1px solid transparent; user-select: none;
        }
        .cell .ch { font-size: 1.5rem; line-height: 1.25; border-bottom: 2px dashed color-mix(in srgb, var(--primary) 55%, transparent); }
        .cell.pinned .ch { border-bottom: 2px solid var(--success); }
        .cell .keys { font-size: .68rem; color: var(--text-muted); margin-top: 2px; letter-spacing: 1px; }
        .cell.selected { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 10%, transparent); }
        .cell.pending .ch { color: var(--text-muted); border-bottom-style: dotted; }
        .fc-cell { border-color: var(--warn); }
        .compose-actions { display: flex; gap: 8px; margin-top: 8px; }
        .btn {
            flex: 1; border: 0; border-radius: var(--radius-md); padding: 12px; font-size: 1rem; cursor: pointer;
            background: var(--primary); color: #fff;
        }
        .btn:disabled { opacity: .45; cursor: default; }
        .btn.secondary { background: var(--bg-main); color: var(--text-main); border: 1px solid var(--border-color); }

        /* 候選列 */
        .candidate-bar { display: flex; flex-wrap: wrap; gap: 6px; min-height: 46px; align-items: center; }
        .cand {
            display: flex; align-items: center; gap: 5px; padding: 6px 10px; border-radius: var(--radius-sm);
            border: 1px solid var(--border-color); cursor: pointer; font-size: 1.15rem; user-select: none;
        }
        .cand:hover { border-color: var(--primary); }
        .cand .num { font-size: .72rem; color: var(--text-muted); }
        .cand-hint { font-size: .8rem; color: var(--text-muted); }

        /* 模式與狀態列 */
        .status-line { display: flex; justify-content: space-between; align-items: center; font-size: .8rem; color: var(--text-muted); padding: 0 2px; }
        .mode-chip { padding: 2px 10px; border-radius: 999px; border: 1px solid var(--border-color); }
        .mode-chip.fc { border-color: var(--warn); color: var(--warn); }

        /* 虛擬鍵盤 */
        .vk { display: flex; flex-direction: column; gap: 5px; }
        .vk-row { display: flex; gap: 5px; justify-content: center; }
        .vk-key {
            flex: 1; max-width: 58px; border: 1px solid var(--border-color); border-radius: var(--radius-sm);
            background: var(--bg-surface); color: var(--text-main); cursor: pointer; padding: 6px 0 4px;
            display: flex; flex-direction: column; align-items: center; font-size: .85rem; user-select: none;
            touch-action: manipulation;
        }
        .vk-key .sub { font-size: .72rem; color: var(--primary); }
        .vk-key.special { max-width: 84px; color: var(--text-muted); }
        .vk-key.wide { max-width: 200px; flex: 3; }
        .vk-key:active, .vk-key.active-state { background: color-mix(in srgb, var(--primary) 22%, var(--bg-surface)); }
        .vk-toggle { text-align: center; font-size: .8rem; color: var(--text-muted); cursor: pointer; padding: 4px; }

        #toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: var(--text-main); color: var(--bg-surface); padding: 8px 18px; border-radius: 999px;
            font-size: .9rem; opacity: 0; pointer-events: none; transition: opacity .25s;
        }
        #toast.show { opacity: .92; }
        .hidden { display: none !important; }
        @media (max-width: 480px) { .cell .ch { font-size: 1.35rem; } }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <h1>WebDayi <span style="color:var(--primary)">Smart</span> <small style="font-size:.7rem;color:var(--text-muted)">智慧2碼 PoC v0.1.0</small></h1>
            <div class="links"><a href="../lite/index.html">← Lite(傳統版)</a> · <span id="theme-toggle" style="cursor:pointer">🌓</span></div>
        </header>

        <div class="card">
            <div class="out-head">
                <span class="label">輸出(送出後按 Copy 交付)</span>
                <span>
                    <button id="copy-btn">📋 Copy</button>
                    <button id="clear-btn" class="danger">✕ 清空</button>
                </span>
            </div>
            <textarea id="output-buffer" placeholder="送出的句子會出現在這裡…" readonly></textarea>
        </div>

        <div class="card">
            <div class="status-line">
                <span>輸入緩衝區(虛線=暫定,點字修正;綠線=已鎖定)</span>
                <span id="mode-chip" class="mode-chip">智慧 2 碼</span>
            </div>
            <div id="compose-area" class="compose-area">
                <span class="compose-hint">連續打碼:每字 2 鍵 = <b>首碼+末碼</b>(單碼字打 1 鍵 + 空白)。<code>`</code> = 全碼逃生口,Enter = 送出</span>
            </div>
            <div class="compose-actions">
                <button id="commit-btn" class="btn" disabled>送出 ⏎</button>
                <button id="buf-backspace-btn" class="btn secondary">⌫ 退格</button>
            </div>
        </div>

        <div class="card">
            <div id="candidate-bar" class="candidate-bar">
                <span class="cand-hint">點選緩衝區的字即可列出該位置候選(按數字鍵替換)</span>
            </div>
        </div>

        <div class="card" id="vk-card">
            <div id="virtual-keyboard" class="vk"></div>
            <div id="vk-toggle" class="vk-toggle">收合鍵盤 ▾</div>
        </div>

        <div class="status-line"><span id="status-indicator">初始化中…</span><span id="latency"></span></div>
    </div>
    <div id="toast"></div>

    <script>
        window.WEBDAYI_SMART_VERSION = { version: '0.1.0', build: '20260812-001', name: 'Smart 2-code PoC' };
        console.log(`%cWebDayi Smart v${WEBDAYI_SMART_VERSION.version} (${WEBDAYI_SMART_VERSION.build})`, 'color:#0fb8f0;font-weight:bold');
    </script>
    <script src="js/decoder.js"></script>
    <script src="js/user_history.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
